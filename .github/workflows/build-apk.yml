name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build
        run: |
          SRC=$(dirname "$(find . -name pubspec.yaml -not -path './build_app/*' | head -1)")
          echo "Source: $SRC"
          flutter create --platforms=android --project-name payam --org com.payam build_app
          cp "$SRC/pubspec.yaml" build_app/pubspec.yaml
          rm -rf build_app/lib build_app/test
          cp -r "$SRC/lib" build_app/lib
          cd build_app
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"#' $M
          sed -i 's#android:label="payam"#android:label="پیام"#' $M
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: payam-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
